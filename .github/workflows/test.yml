name: test

on:
  push:
    branches: [master, dev]
  pull_request:

# 两个 job 都只做 checkout/setup-node/npm/upload-artifact，不写回仓库任何东西，
# 所以把 GITHUB_TOKEN 收到最小面。（upload-artifact 走 ACTIONS_RUNTIME_TOKEN，不吃这里的权限。）
permissions:
  contents: read

# 连推时取消同分支的旧 run，只留最新一次的反馈。
# master 例外：发版那次的完整 run 记录要留着，被后续推送腰斩就查不了了。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # npm run check 从 e2e 里拆出来独立成 job：它是零 token、本机几秒跑完的静态闸，
  # 此前却排在 `playwright install --with-deps chromium` 之后，语法错也要等浏览器装完才报。
  # 拆开后 quality 先红，省掉整轮 e2e 的等待。
  # ★ 拆走后 e2e 不再跑 check —— master 分支保护的 required contexts 必须含 quality，
  #   否则出现「check 红了 PR 照样能合」。改这个 job 名必须同步改分支保护。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 —— check 链里的 check-diagram-claims 要验「架构图声称的基线提交仍在当前历史里」，
      # 而默认的浅克隆（depth=1）下那个对象根本不在工作区，git 报 `fatal: Not a valid commit name`。
      # 2026-09-09 建闸起这个 job 在 CI 上一直红、本地一直绿，就是这个原因。仓库 54MiB，全量克隆可忽略。
      # 只给 quality 加：unit-test / e2e 不碰 git 历史，浅克隆更快。
      # master 是「对外发布的稳定版本」——装机 curl 拉的就是它的源码归档，所以它的 HEAD 必须恒等于
      # 最新发布。唯一允许进入它的路径是 scripts/release.sh 开的那条 dev → master 发版 PR。
      #
      # 【为什么是 quality 里的一个 step，不是独立 job】独立 job 加 `if:` 之后，在非 master 的 PR 上
      # 会被 skip；而被 skip 的 job 若列进分支保护的 required checks，PR 会永久停在 pending。
      # 塞进一个本来就恒跑的 required job 里就没有这个坑。
      #
      # 【这道闸挡的是什么】2026-09-12 之前 dependabot 的 PR 默认开到 master（#23 就是），合进去
      # master 立刻带上未发版提交，那一刻拉归档的人拿到的代码与版本号对不上、且没有任何地方报错。
      # 根因已由 .github/dependabot.yml 的 target-branch 修掉，这里是第二道——它管所有来源，
      # 包括人手开的 PR。
      - name: 只有 dev → master 的发版 PR 能进 master
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::master 只接受 scripts/release.sh 开的 dev → master 发版 PR（当前 head=${{ github.head_ref }}）。请把这个改动开到 dev。"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # engines 声明 ">=20"（给自托管用户的承诺：Ubuntu/Debian 仓库里常见的就是 20），
      # 但 7/31 修 force-exit 竞态时把 CI 从 20 升到了 24，此后 20 再没被验证过。
      # 矩阵补回这个缺口：engines 承诺什么，CI 就得跑什么。
      # fail-fast: false —— 20 挂了也要看到 24 的结果，才能区分「只有旧版挂」和「全挂」。
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 不跑 `npm test`（= unit + integration 且带 --test-force-exit）。force-exit 是为集成测试
      # 加的（起真 server，挂死过），但它会与单测里 await 真实 timer 的异步用例竞态：一旦文件调度
      # 让那个文件落到尾部，进程就在它跑完前退出，整个 suite 变 cancelledByParent —— 报出来是
      # 「fail 0 但 cancelled 5」，exit 1。7/30 起 CI 连红即此，与被测代码无关。
      # test:unit 本就不带该 flag，拆开跑即可，防挂死保护仍留在 integration 上。
      - run: npm run test:unit
      # 不变量测试树（tests/invariants/）：test:unit 的 glob 是 tests/unit/*.test.mjs，捞不到它。
      # 不接这一步的话，它写多少条都不会在 CI 上跑——写了等于没有回归保护。
      # 与 test:unit 同档（纯函数 + 一次性目录真磁盘），故同 job、不另起 runner。
      - run: npm run test:invariants
      # 不变量树的 S2 层（tests/invariants/server/）：起真 app/server.js 子进程，宿主机上不允许跑
      # （不在 guard-host-tests 白名单里），但 CI runner 本身是一次性的，隔离强于本机容器。
      # CLAUDE_BIN 指向 stub 让 preflight 过关；需要真 agent turn 的断言不在这一层。
      - run: npm run test:invariants:server
        env:
          CLAUDE_BIN: ${{ github.workspace }}/tests/fixtures/fake-claude.sh
      # 不变量树的环境级槽（tests/invariants/env/）：卸载器的对称性。它的隔离依赖被测代码认注入的
      # home/root/appPath，宿主机上不允许跑；runner 是一次性 Linux 机器，且 platform 非 darwin
      # ⇒ launchd / CCM.app / 偏好域三段整段跳过，真 CLI 那条用例才有安全的执行位。
      - run: npm run test:invariants:env
      # 集成测试是【唯一执行真实 app/src/server/app.js 的一层】：quality 是纯静态、test:unit 从不加载
      # 那个文件、e2e 打的是 tests/e2e/mock/server.js 而非真 server。此前它在 CI 里被整体 skip
      # （21 个文件全带 `process.env.CI ? {skip}`，实测 30 suites 只出 3 tests），于是仓库最大的
      # 两个文件在 CI 零执行。2026-08-02 改：CLAUDE_BIN 指向 stub 让 preflight 过关，接线类测试
      # 照常跑；真需要 agent turn 的仍由各文件自己的 RUN_CLAUDE_INTEGRATION 门跳过（不受这里影响）。
      - run: npm run test:integration
        env:
          CLAUDE_BIN: ${{ github.workspace }}/tests/fixtures/fake-claude.sh

  # ★ 这个 job 的名字是 `e2e-shard`，不是 `e2e` —— 分支保护的 required context 仍然叫 `e2e`，
  #   由下面那个汇总 job 提供。matrix job 的名字必然带参数（`e2e (1)`…），直接把 e2e 改成 matrix
  #   会让 `e2e` 这个 context 再也不出现，PR 永久停在 pending —— 与本文件上面记的
  #   「被 skip 的 job 若列进 required checks 会永久 pending」是同一个坑的另一种形态。
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # ★ fail-fast: false 在这里【不只是为了看全结果】，它是汇总 job 判据成立的前提：
      #   true 的话一片红会取消其余分片，那些片交不回时长片段，于是并集校验报「漏跑」——
      #   而真因是「被取消」。两种原因指向完全不同的排查方向，不能混。
      fail-fast: false
      matrix:
        # ★★ 这个列表的长度必须与下面 CCM_E2E_SHARDS 逐字一致 ★★
        #   matrix 少于 SHARDS ⇒ 有整片没人跑，**六个分片全绿**，靠汇总 job 的并集校验（TEST-02）
        #     才会红。那道闸就是为这个建的，但别指望它替你想清楚。
        #   matrix 多于 SHARDS ⇒ 多出来的 SHARD_INDEX 非法，脚本回落成「跑全部分片」，
        #     结果正确但慢几倍。GitHub Actions 的 matrix 引用不了 env，只能靠这两行对齐。
        #
        # 【为什么是 8 —— 以下全是横向分片下的实测，不是推算】
        # 各片【净测试时长】（不含 33-41s 的固定开销）：
        #   run 34743727175  等权重  57 / 83 / 95 / 105 / 162 / 213s     合计 715s
        #   run 34743993695  等权重  58 / 84 / 98 /  99 / 145 / 209s     合计 693s
        #   run 34744216219  LPT    106 /108 /113 /114 /116 /131s        合计 688s  ← 均衡后
        # CI 真实串行基线 ~690s，不是本文件下面那个同机时代的 632s。
        # 6 片 LPT 实测墙钟 178s；8 片理想值 690/8 ≈ 86s，但**地板**（最大单文件
        # workspace-sessions-sidebar，CI 上约 92s）此时已经高于理想值 ⇒ 落点 ~128s。
        # 再往上加片一秒都省不到：10 片理想 69s，仍被同一个 92s 的地板卡住。
        #
        # 【首次 run 会慢，这是预期】缓存为空时 LPT 退化成按文件数轮转，两个大文件撞进同一片，
        # 最慢片 209-213s（前两轮都是）。仍快于改造前的 255s——横向消除的 CPU 争抢盖过了
        # 分配不均的损失。缓存一旦建立就回到稳态；per-spec 时长与分片数无关，所以改这个数
        # 不会让已有缓存失效。
        #
        # 【要改这个数之前先确认】分片数变化会重排「哪些 spec 共用一个 mock server 进程、按什么
        # 顺序跑」，而 mock server 用模块级全局变量存状态 ⇒ 可能照出新的隐藏耦合。由 retries:1 兜，
        # 但改完要看一眼有没有新的 flaky。
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 时长缓存决定 LPT 分配。它不进版本库（本机测量值，进了就是会漂移的第二真相），
      # 所以 CI 上只能靠 cache 跨 run 复用 —— 在建这道 cache 之前，CI 日志里【每一次】
      # 都打的是「首次运行（无时长数据，等权重分配）」，LPT 从上线起在 CI 上一次都没生效过。
      # restore-keys 前缀匹配取最近一份：PR 继承 base 分支（dev）的缓存，dev 每次 push 刷新。
      - name: Restore E2E duration cache
        uses: actions/cache/restore@v6
        with:
          path: tests/infra/.e2e-durations.json
          key: e2e-durations-${{ github.run_id }}
          # ★ 值必须留在下一行（actions/cache 官方支持的多行列表形式）。把前缀写回与键名同一行
          # 会被 gitleaks 的 generic-api-key 规则命中：键名含 keys、值的熵 3.52 刚过阈值，
          # 于是一个 cache 前缀被当成泄漏的密钥，pre-commit 当场拦下 commit。
          restore-keys: |
            e2e-durations-

      # 浏览器二进制单独缓存（~170MB）。key 跟 package-lock 走：Playwright 一升版就自然换 key，
      # 不会拿旧浏览器配新 driver。`install-deps` 装的是系统 apt 依赖、不属于这个缓存，仍要跑，
      # 但它比下载浏览器快得多。实测这一步从 25s（改造前 `--with-deps` 连下带装）降到 12-17s。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npx playwright install-deps chromium
          npx playwright install chromium

      # 分片并行（tests/infra/e2e-parallel.js）：N 个独立进程各起自己的 mock server 跑一组 spec。
      # playwright.config.ts 的 workers:1 不能动（mock server 用模块级全局变量当状态存储，多 worker
      # 共打同一进程会互相踩踏直至崩溃），并发只能靠进程级隔离拿。
      #
      # 2026-09-13 起每个分片独占一台 runner（CCM_E2E_SHARD_INDEX），此前是【4 片挤同一台 4 核机】。
      # 下面这段实测记录留着，因为它解释了为什么要横向拆，也因为其中两条结论仍然有效。
      #
      # 【同机时代的实测】
      #   串行  632s  绿（同期 10 次里 9 次绿）
      #   4 分片 269s  红 task-progress P0-17i        run 34709034273
      #   2 分片 373s  红 long-stream-interrupt P0-04  run 34709543333
      #   4 分片 255s  全绿（各片 204/234/240/252）    run 34741998773
      # 加速比只有 632/255 = 2.5 而不是 4，差的那截全是 CPU 争抢——这正是横向拆的理由。
      #
      # 【仍然有效】红的病因不止 CPU 争抢：P0-04 报的是 element(s) not found 而非超时，不是时序形态。
      # 分片真正改变的还有「哪些 spec 共用一个 mock server 进程、按什么顺序跑」，而 mock server
      # 用模块级全局变量存状态 ⇒ spec 间的隐藏耦合会被重排暴露。**改任何分配方式都要承担一次**，
      # 由 retries:1 兜（playwright.config.ts 里写了为什么 retries 不等于掩盖真 bug）。
      #
      # 【已失效，别再照搬】「8 分片会偶发假红」的病因之一是 4 核跑 8 个 Chromium；横向分片下
      # 每台 runner 只有 1 个，CPU 供给比同机 4 片时还宽松，那条不成立。
      # 同理「别用串行时长 ÷ 分片数估耗时」（实测偏乐观 57%）——那个偏差的成因是 CPU 供给不足，
      # 独占 runner 后成因消失。但**它仍然只是推算，以真 run 为准**。
      #
      # 【地板 85s】同一个 spec 文件不跨分片，workspace-sessions-sidebar 单文件就要 85s，任何分片数
      # 都突破不了。再要快只能拆那个文件——那是重组测试内容，不是调这里的参数。
      - name: Run Playwright E2E (shard ${{ matrix.shard }}/8)
        run: npm run test:e2e:parallel
        env:
          CCM_E2E_SHARDS: '8'   # ★ 必须等于上面 matrix.shard 列表的长度，理由见那里
          CCM_E2E_SHARD_INDEX: ${{ matrix.shard }}

      # 本片实测到的每个 spec 的时长。汇总 job 拿它做两件事：并集校验（TEST-02，少一个就红）
      # 与合并回写缓存。★ if: always() —— 分片红了也要交回片段，否则汇总 job 只能看见
      # 「缺了片段」，分不清是漏跑还是失败。
      #
      # ★ if-no-files-found: error（不是默认的 warn）。这里捞空【永远不正常】：分片只要跑到
      # 最后就一定写出片段。默认的 warn 会让上传出一个空 artifact 而 job 照样绿，错误一路
      # 推迟到汇总 job 炸在 readdir 上——报错指向 fs，不指向真正的原因。
      # 注意这跟下面 test-results 那个不同：那边捞空是正常的（全绿时没有失败产物），所以留 warn。
      - name: Upload shard durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-shard-${{ matrix.shard }}
          path: tests/infra/e2e-durations-shard${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

      # ★ 产物是 test-results*/ 而不是 playwright-report*/：分片子进程走
      # `npm run test:e2e -- <files> --reporter=list`，命令行的 --reporter 会【覆盖】config 里的
      # reporter 数组，html 那一项根本不执行 ⇒ playwright-report-shardN/ 从来不会生成。
      # 照搬串行时代的 playwright-report/ 会让上传永远捞空，而 upload-artifact 捞空只 warn 不红，
      # 表现为「改好了」但失败时一张截图都没有。失败截图（screenshot: only-on-failure）与
      # trace（on-first-retry，随 retries:1 一起真正开始产出）都落在 test-results-shardN/。
      #
      # ★ always() 而不是 failure()：开了 retries:1 之后最值得看的恰恰是【重试转绿】那一类
      # ——job 结论是 success，failure() 根本抓不到，trace 当场丢掉，flaky 就又变回查不动的了，
      # 那等于只拿了 retries 的「不阻塞」，丢掉了它的「可诊断」。
      #
      # 全绿那一轮这一步会打一条 `No files were found ... test-results*/` 的 warning
      # （实测 run 34713413770）：Playwright 没有失败产物时压根不建 outputDir。这是预期噪音，
      # 不是配错了。仍保留默认的 if-no-files-found: warn 而不改成 ignore——**路径写错导致的
      # 捞空必须留得下痕迹**，那正是这次改 path 之前的形态，静音掉就再也发现不了。
      #
      # ★ 名字带 shard 号：upload-artifact v4 起同名 artifact 直接报错（不再像 v3 那样合并），
      # matrix 下六个 job 同时上传同一个名字会让整个 job 红，且红在与测试无关的地方。
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts-shard-${{ matrix.shard }}
          path: test-results*/
          retention-days: 7

  # ★ 这个 job 必须叫 `e2e`：它是分支保护里那个 required context（dev 与 master 都要求
  #   `quality` / `unit-test (20)` / `unit-test (24)` / `e2e`）。改名等于让所有 PR 永久 pending。
  #
  # 它做两件事，顺序不能换：
  #   ① 先看分片结论——有片失败/被取消就直接红。放在前面是为了不让下一步的「缺片段」
  #      把一次普通的测试失败误报成「漏跑」，那会把人推向完全错误的排查方向。
  #   ② 分片全绿时才做并集校验（TEST-02）：横向分片后每台 runner 各自读时长缓存算分组，
  #      任何一台 cache 未命中就会算出另一套分组，于是某些 spec 谁都没跑，而六个分片全绿。
  #      这类漏跑在 CI 上【表现为全绿】，没有这道闸就只能等某天线上出事才发现。
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 分片结论
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::有 e2e 分片未通过（result=${{ needs.e2e-shard.result }}）。失败截图见对应 playwright-e2e-artifacts-shard-N。"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: e2e-durations-shard-*
          path: e2e-durations
          merge-multiple: true

      - name: 并集校验 + 合并时长
        run: node tests/infra/e2e-parallel.js --merge-durations e2e-durations

      # ★ PR run 也保存，不加 event_name 限制。这份表只有几 KB（配额上限 10GiB，与它无关），
      # 而只在 push 时存的话，一个新 workflow 的【第一个 PR】永远拿不到缓存——base 分支上
      # 还没有任何一次 run 写过它，于是该 PR 的每一轮都退化成等权重分配。
      # PR 写的缓存受分支隔离，别的 PR 读不到，但同一个 PR 的后续 push 读得到，这正是要的。
      - name: Save E2E duration cache
        run: cp e2e-durations/merged.json tests/infra/.e2e-durations.json
      - uses: actions/cache/save@v6
        with:
          path: tests/infra/.e2e-durations.json
          key: e2e-durations-${{ github.run_id }}
