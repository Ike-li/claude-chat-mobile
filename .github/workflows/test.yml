name: test

on:
  push:
    branches: [master, dev]
  pull_request:

# 所有 job 只做 checkout/setup/test/upload-artifact，不写回仓库任何东西，
# 所以把 GITHUB_TOKEN 收到最小面。（upload-artifact 走 ACTIONS_RUNTIME_TOKEN，不吃这里的权限。）
permissions:
  contents: read

# 连推时取消同分支的旧 run，只留最新一次的反馈。
# master 例外：发版那次的完整 run 记录要留着，被后续推送腰斩就查不了了。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # npm run check 从 e2e 里拆出来独立成 job：它是零 token、本机几秒跑完的静态闸，
  # 此前却排在 `playwright install --with-deps chromium` 之后，语法错也要等浏览器装完才报。
  # 拆开后 quality 先红，省掉整轮 e2e 的等待。
  # ★ 拆走后 e2e 不再跑 check —— master 分支保护的 required contexts 必须含 quality，
  #   否则出现「check 红了 PR 照样能合」。改这个 job 名必须同步改分支保护。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # engines 声明 ">=20"（给自托管用户的承诺：Ubuntu/Debian 仓库里常见的就是 20），
      # 但 7/31 修 force-exit 竞态时把 CI 从 20 升到了 24，此后 20 再没被验证过。
      # 矩阵补回这个缺口：engines 承诺什么，CI 就得跑什么。
      # fail-fast: false —— 20 挂了也要看到 24 的结果，才能区分「只有旧版挂」和「全挂」。
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 不跑 `npm test`（= unit + integration 且带 --test-force-exit）。force-exit 是为集成测试
      # 加的（起真 server，挂死过），但它会与单测里 await 真实 timer 的异步用例竞态：一旦文件调度
      # 让那个文件落到尾部，进程就在它跑完前退出，整个 suite 变 cancelledByParent —— 报出来是
      # 「fail 0 但 cancelled 5」，exit 1。7/30 起 CI 连红即此，与被测代码无关。
      # test:unit 本就不带该 flag，拆开跑即可，防挂死保护仍留在 integration 上。
      - run: npm run test:unit
      # 集成测试会执行真实 app/src/server/app.js；真需要 agent turn 的文件仍由
      # RUN_CLAUDE_INTEGRATION 门控，CI 通过 CLAUDE_BIN stub 只验证零 token 接线。
      - run: npm run test:integration
        env:
          CLAUDE_BIN: ${{ github.workspace }}/tests/fixtures/fake-claude.sh
      # 覆盖率门槛只在 Node 24 上算一次。
      - run: node tests/gates/coverage-check.js
        if: matrix.node == '24'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 7

  # 真实产品接线浏览器验收：Docker 内启动真正 app/server.js，走真实 HTTP/Socket、
  # TOFU/device approve/workspace；Claude 仍用 fake-claude.sh，因此零 token、无外部凭据。
  # 这条 lane 的目的不是替代 tests/e2e/mock，而是防 mock server 与 production server 协议漂移。
  real-app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run real-app playground E2E
        run: npm run test:docker:playground

      - name: Dump playground logs on failure
        if: failure()
        run: |
          COMPOSE_PROFILES=mock,proxy docker compose \
            -f tests/infra/docker-compose.playground.yml \
            -f tests/infra/docker-compose.playground.test.yml \
            logs --no-color --tail=300 || true
