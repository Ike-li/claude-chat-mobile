name: test

on:
  push:
    branches: [master, dev]
  pull_request:

# 两个 job 都只做 checkout/setup-node/npm/upload-artifact，不写回仓库任何东西，
# 所以把 GITHUB_TOKEN 收到最小面。（upload-artifact 走 ACTIONS_RUNTIME_TOKEN，不吃这里的权限。）
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # 不跑 `npm test`（= unit + integration 且带 --test-force-exit）。force-exit 是为集成测试
      # 加的（起真 server，挂死过），但它会与单测里 await 真实 timer 的异步用例竞态：一旦文件调度
      # 让那个文件落到尾部，进程就在它跑完前退出，整个 suite 变 cancelledByParent —— 报出来是
      # 「fail 0 但 cancelled 5」，exit 1。7/30 起 CI 连红即此，与被测代码无关。
      # test:unit 本就不带该 flag，拆开跑即可，防挂死保护仍留在 integration 上。
      - run: npm run test:unit
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 顺带把 npm run check（语法/文档一致性/mock registry guard/TC-007 test.fixme 等禁止模式硬闸）
      # 接入 CI——此前它只在本机跑，CI 从未验证过。
      - run: npm run check

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 7
