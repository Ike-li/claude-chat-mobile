name: upstream-watch

# 查本仓库钉的 Agent SDK 有没有落后上游，产出一份带判据的 changelog 摘录到 job summary。
#
# ⚠️ **只手动触发，故意没有 schedule。** 原先每天跑一次并自动开 / 更新 issue，实测退化成纯噪音：
# 那条 issue 挂了 35 天、27 条「上游又前进了」评论、零人类响应。原因是它报的「落后 N 版」这个
# 指标，恰恰是逐条核对后被判定为「不该据此行动」的那个数字（SDK 是瘦 transport，67 条里真命中
# 只有 3 条）；而「只在版数前进时才通知」的降噪设计，在天天发版的上游面前每天都成立。
# 详见 scripts/upstream-watch.js 文件头。想核对时来这里点 Run workflow，或本地 npm run watch:upstream。
on:
  workflow_dispatch:

# ⚠️ workflow_dispatch 只认**默认分支**上的 workflow 文件（官方原文：This event will only trigger
# a workflow run if the workflow file exists on the default branch）。本文件必须进 master
# 才会出现在 Actions 的 Run workflow 下拉里，留在 dev/feature 分支上一次都点不到。

permissions:
  contents: read   # 只读本仓库代码（package.json 是对比基准）。不再开 issue，故不要 issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 不装依赖：upstream-watch.js 零依赖（Node 内置 fetch），单测也只用 node --test。
      # 省掉 npm ci 的一分钟。
      - name: 自检（逻辑坏了要在出报告之前就知道）
        run: node --test tests/unit/upstream-watch.test.mjs

      # 报告走 stdout、进度走 stderr，所以这一行重定向拿到的就是干净的 markdown。
      # 看结果：本次运行页面的 Summary 那一栏，GitHub 会把它渲染成表格 + 折叠块。
      - name: 查上游版本并写进 job summary
        run: node scripts/upstream-watch.js >> "$GITHUB_STEP_SUMMARY"
