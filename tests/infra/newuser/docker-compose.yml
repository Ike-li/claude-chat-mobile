# tests/infra/newuser/docker-compose.yml —— 四档公网方案的「新用户内网电脑」（测试基础设施，不是产品入口）
#
# 先在仓库根跑 `node tests/infra/newuser/prepare.mjs <运行目录> <宿主机LAN IP>` 生成运行产物
# （分发 tarball、claude 凭据副本、假边缘密钥），再：
#   docker compose -f tests/infra/newuser/docker-compose.yml --env-file <运行目录>/compose.env --profile lan up --build -d
# 运行产物含中转凭据，只能放仓库外（scratchpad），本文件通过 NEWUSER_RUN_DIR 引用。
#
# 宿主机浏览器打开（宿主机就是「公网」）：
#   lan            http://<IP>:13001/#token=<TOKEN>   容器看到的 peer 是 docker 网关，设备审批走真流程
#   direct         http://<IP>:13002/#token=<TOKEN>   网络形态同 lan，差别只在 ACCESS_PROFILE 声明与 doctor
#   reverse-proxy  http://<IP>:13003/#token=<TOKEN>   nginx 与 ccm 同 netns，proxy_pass 127.0.0.1，TRUSTED_PROXY=loopback
#   cloudflare     http://<IP>:13004/                 假边缘注入 Access JWT，无需 #token=
# TOKEN：docker compose … exec <服务> node scripts/config.js get AUTH_TOKEN --reveal
# 设备审批：docker compose … exec <服务> node scripts/device.js list | approve <ID>
name: ccm-newuser

x-image: &image
  build:
    context: .
    dockerfile: Dockerfile
  # 镜像名带仓库区分度（与 docker-compose.test.yml 同一条纪律：镜像名全机共享，通用名会被别的项目覆盖）
  image: claude-chat-mobile-newuser:local
  init: true
  environment:
    NEWUSER_HOST_IP: ${NEWUSER_HOST_IP:?宿主机 LAN IP}
  healthcheck:
    test: ["CMD", "bash", "/newuser/healthcheck.sh"]
    interval: 5s
    timeout: 5s
    retries: 30
    # npm install 经代理逐包拉取，四容器并跑实测 8–20 分钟；宽限不够时依赖它的 nginx 边车不会自动起
    start_period: 1800s

x-nginx: &nginx
  image: nginx:1.27-alpine
  command: ["nginx", "-g", "daemon off;"]

services:
  lan:
    <<: *image
    profiles: [lan]
    command: ["bash", "/newuser/entrypoint.sh", "lan", "13001"]
    ports: ["13001:3000"]
    volumes:
      - home-lan:/home/node
      - ${NEWUSER_RUN_DIR:?运行目录}/claude-chat-mobile.tar.gz:/dist/claude-chat-mobile.tar.gz:ro
      - ${NEWUSER_RUN_DIR}/settings.json:/run/newuser/settings.json:ro

  direct:
    <<: *image
    profiles: [direct]
    command: ["bash", "/newuser/entrypoint.sh", "direct", "13002"]
    ports: ["13002:3000"]
    volumes:
      - home-direct:/home/node
      - ${NEWUSER_RUN_DIR}/claude-chat-mobile.tar.gz:/dist/claude-chat-mobile.tar.gz:ro
      - ${NEWUSER_RUN_DIR}/settings.json:/run/newuser/settings.json:ro

  proxy:
    <<: *image
    profiles: [proxy]
    command: ["bash", "/newuser/entrypoint.sh", "reverse-proxy", "13003"]
    # 端口声明在 netns 的拥有者上；3000 不发布，只有 nginx 的 8080 对宿主机可见
    ports: ["13003:8080"]
    volumes:
      - home-proxy:/home/node
      - ${NEWUSER_RUN_DIR}/claude-chat-mobile.tar.gz:/dist/claude-chat-mobile.tar.gz:ro
      - ${NEWUSER_RUN_DIR}/settings.json:/run/newuser/settings.json:ro
  proxy-nginx:
    <<: *nginx
    profiles: [proxy]
    network_mode: service:proxy
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      proxy:
        condition: service_healthy

  cf:
    <<: *image
    profiles: [cf]
    command: ["bash", "/newuser/entrypoint.sh", "cloudflare", "13004"]
    ports: ["13004:8081"]
    volumes:
      - home-cf:/home/node
      - ${NEWUSER_RUN_DIR}/claude-chat-mobile.tar.gz:/dist/claude-chat-mobile.tar.gz:ro
      - ${NEWUSER_RUN_DIR}/settings.json:/run/newuser/settings.json:ro
      - ${NEWUSER_RUN_DIR}/cf/cf.env:/run/newuser/cf.env:ro
      - ${NEWUSER_RUN_DIR}/cf/jwks.json:/run/newuser/jwks.json:ro
  cf-edge:
    <<: *nginx
    profiles: [cf]
    network_mode: service:cf
    volumes:
      - ${NEWUSER_RUN_DIR}/cf/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cf:
        condition: service_healthy

volumes:
  home-lan:
  home-direct:
  home-proxy:
  home-cf:
