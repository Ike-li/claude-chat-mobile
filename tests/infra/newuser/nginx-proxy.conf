# reverse-proxy 档：与 ccm 容器共享网络命名空间，peer 是 127.0.0.1，与 docs/deployment.md 的 nginx 示例同形。
# Host 改写成公网样名字（宿主机浏览器打的是 <IP>:13003，透传会让 CCM 看到一个私网 Host）。
server {
    listen 8080;
    server_name ccm.proxy.test;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host ccm.proxy.test;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        # 追加（不是透传）：末跳才是本 nginx 看到的真实来源；CCM 侧配了 TRUSTED_PROXY=loopback 才读。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
