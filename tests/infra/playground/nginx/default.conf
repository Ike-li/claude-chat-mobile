# 这是测试夹具，不是 docs/deployment.md 反代示例的拷贝。
# 生产反代必须 proxy_set_header Host $host，否则设备审批读到的 Host 不是客户端用的公网名。
# 本 nginx 与 app 同 netns，peer 已经是 127.0.0.1。若透传 $host（宿主机 :18080 上是 127.0.0.1:18080），
# shouldBypassDeviceApproval 会 true——夹具存在的意义就是挡住这条。必须把 Host 改写成公网样名字。
server {
    listen 8080;
    server_name playground.example.test;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host playground.example.test;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        # 追加（不是透传）X-Forwarded-For：只有反代自己追加的末跳才可信，CCM 也只在
        # TRUSTED_PROXY=loopback 显式声明时读它（AUTH-04）。compose 未开该项时 CCM 不读，此行无副作用。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 不要开 Express trust proxy：CCM 自己算限速来源，不走 req.ip。
    }
}
